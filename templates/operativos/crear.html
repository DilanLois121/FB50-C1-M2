<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear operativo</title>
    {% if messages %}
    {% for message in messages %}
        <p style="color: green;">{{ message }}</p>
    {% endfor %}
{% endif %}
</head>

<body>

    <h1>Registrar nuevo operativo</h1>

    <p>Complete los datos para programar un operativo.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit">Registrar operativo</button>
    </form>

</body>
</html>
