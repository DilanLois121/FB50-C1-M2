
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
</head>

<body>

    <h1>Iniciar sesión</h1>

    <p>Ingrese sus credenciales del sistema municipal.</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="rut">RUT:</label>
            <input
                type="text"
                id="rut"
                name="rut"
                required
            >
        </div>

        <div>
            <label for="clave">Clave:</label>
            <input
                type="password"
                id="clave"
                name="clave"
                required
            >
        </div>

        <button type="submit">Ingresar</button>
    </form>

</body>
</html>
